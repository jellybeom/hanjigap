[project]
name = "hanjigap"
version = "0.1.0"
description = "한지갑 - 부부 합산 가계부·자산관리 (뱅크샐러드 월간 내보내기 기반)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.4",
    "openpyxl>=3.1",
    "msoffcrypto-tool>=6.0",
    # Windows에는 IANA 시간대 DB가 없어서 zoneinfo("Asia/Seoul")에 필요
    "tzdata>=2024.1",
]

[project.scripts]
hanjigap = "hanjigap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanjigap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 포매터는 Black, ruff는 린트(실수 점검)만 담당
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]